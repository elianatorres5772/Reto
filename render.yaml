services:
  - type: web
    name: registro-proveedor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: LLM_API_KEY
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: AGENT_MAX_ITERATIONS
        value: 25
      - key: LLM_MAX_SESSION_TOKENS
        value: 100000
      - key: LLM_MAX_DAILY_TOKENS
        value: 1000000
