name: Validacion
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm exec bun run demo.ts
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  bdd-screenplay-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:browsers --with-deps
      - run: pnpm run test:bdd
      - run: pnpm run test:mcp
        env:
          PLAYWRIGHT_MCP_NO_SANDBOX: '1'
      - run: pnpm exec serenity-bdd update
      - run: pnpm run report:bdd
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-serenity-screenplay-mcp
          path: reports/
          retention-days: 7
